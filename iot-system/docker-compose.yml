

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: iot_stream_data
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin123
      INFLUXDB_ORG: DEPI
      INFLUXDB_BUCKET: iot-system
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  timescaledb:
    image: timescale/timescaledb:2.11.2-pg14
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_pass123
      POSTGRES_SHARED_BUFFERS: "128MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "256MB"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFLUXDB_URL=https://eu-central-1-1.aws.cloud2.influxdata.com/
      - INFLUXDB_TOKEN=fhZj6TxPeUZ5mHlLxU_MmSDrwUQtP0ZYBVWZv6_ljcffvJrAyl2WIY7aVOuTwclPx-weW-IiwrkcilHpQffr6A==
      - INFLUXDB_ORG=DEPI
      - INFLUXDB_BUCKET=iot_stream_data
      - DATABASE_URL=postgresql://iot_user:iot_pass123@timescaledb:5432/iot_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=supersecretkey
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - kafka
      - influxdb
      - timescaledb
      - redis
    volumes:
      - ./app:/app
      - ./sensors:/sensors
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  sensor-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: sensor-simulator
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SIMULATION_INTERVAL=3
      - NUM_SENSORS=5
      - ANOMALY_RATE=0.08
    depends_on:
      - kafka
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    command: python sensors/simulator.py

  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: stream-processor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFLUXDB_URL=https://eu-central-1-1.aws.cloud2.influxdata.com/
      - INFLUXDB_TOKEN=fhZj6TxPeUZ5mHlLxU_MmSDrwUQtP0ZYBVWZv6_ljcffvJrAyl2WIY7aVOuTwclPx-weW-IiwrkcilHpQffr6A==
      - INFLUXDB_ORG=DEPI
      - INFLUXDB_BUCKET=iot-system
    depends_on:
      - kafka
      - influxdb
      - timescaledb
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    command: python sensors/processor.py

  alert-system:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: alert-system
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFLUXDB_URL=https://eu-central-1-1.aws.cloud2.influxdata.com/
      - INFLUXDB_TOKEN=fhZj6TxPeUZ5mHlLxU_MmSDrwUQtP0ZYBVWZv6_ljcffvJrAyl2WIY7aVOuTwclPx-weW-IiwrkcilHpQffr6A==
      - INFLUXDB_ORG=DEPI
      - INFLUXDB_BUCKET=iot-system
    depends_on:
      - kafka
      - influxdb
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    command: python sensors/alert_system.py

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_SERVER_ENABLE_GZIP=true
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - iot-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

networks:
  iot-network:
    driver: bridge

volumes:
  influxdb-data:
  timescaledb-data:
  grafana-data:
